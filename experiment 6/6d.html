<!DOCTYPE html>
<html>
<head>
    <title>Voter Eligibility</title>
</head>
<body>

<h2>Voter Eligibility</h2>

<script>
    let name = prompt("Enter your name:");
    let age = Number(prompt("Enter your age:"));

    let result;

    if (age >= 18) {
        result = "Eligible to vote";
    } else {
        result = "Not eligible to vote";
    }

    document.write("<table border='1' cellpadding='10'>");

    document.write("<tr>");
    document.write("<th>Name</th>");
    document.write("<th>Age</th>");
    document.write("<th>Voter Eligibility</th>");
    document.write("</tr>");

    document.write("<tr>");
    document.write("<td>" + name + "</td>");
    document.write("<td>" + age + "</td>");
    document.write("<td>" + result + "</td>");
    document.write("</tr>");

    document.write("</table>");
</script>

</body>
</html>
