<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Input</title>
</head>
<body>

<h2>JavaScript Input Method</h2>

<script>
    let name = prompt("Enter your name:");
    let age = prompt("Enter your age:");

    document.write("Hello " + name);
    document.write("Age: " + age);
</script>

</body>
</html>
