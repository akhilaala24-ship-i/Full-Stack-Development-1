<!DOCTYPE html>
<html>
<head>
    <title>User Defined Object</title>
</head>
<body>

    <h2>JavaScript User Defined Object</h2>

    <p id="result"></p>

    <script>
        function Student(name, age, marks) {
            this.name = name;
            this.age = age;
            this.marks = marks;

            this.display = function() {
                return "Name: " + this.name +
                       "<br>Age: " + this.age +
                       "<br>Marks: " + this.marks;
            };
        }

        let s1 = new Student("Akhila", 20, 90);

        Object.defineProperty(s1, "studentName", {
            get: function() {
                return this.name;
            },
            set: function(value) {
                this.name = value;
            }
        });

        s1.studentName = "Akhila";

        document.getElementById("result").innerHTML =
            s1.display() +
            "<br>Accessor Name: " + s1.studentName;
    </script>

</body>
</html>
