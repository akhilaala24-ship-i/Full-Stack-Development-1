<!DOCTYPE html>
<html>
<head>
    <title>Date Object</title>
</head>
<body>

    <h2>JavaScript Date Object</h2>

    <p id="result"></p>

    <script>
        let today = new Date();

        let output = "Current Date: " + today;

        output += "<br>Year: " + today.getFullYear();
        output += "<br>Month: " + (today.getMonth() + 1);
        output += "<br>Day: " + today.getDate();
        output += "<br>Week Day: " + today.getDay();
        output += "<br>Hours: " + today.getHours();
        output += "<br>Minutes: " + today.getMinutes();
        output += "<br>Seconds: " + today.getSeconds();

        document.getElementById("result").innerHTML = output;
    </script>

</body>
</html>
