<!DOCTYPE html>
<html>
<head>
    <title>Regex Object</title>
</head>
<body>

    <h2>JavaScript RegExp Object</h2>

    <p id="result"></p>

    <script>
        let pattern = /JavaScript/i;
        let str = "Welcome to javascript programming";

        let output = "Original String: " + str;

        output += "<br>Pattern: " + pattern.source;
        output += "<br>Ignore Case: " + pattern.ignoreCase;

        output += "<br>Test: " + pattern.test(str);
        output += "<br>Match: " + str.match(pattern);

        let newStr = str.replace(pattern, "HTML");
        output += "<br>Replace: " + newStr;

        document.getElementById("result").innerHTML = output;
    </script>

</body>
</html>
