<!DOCTYPE html>
<html>
<head>
    <title>String Object</title>
</head>
<body>

<h2>String Object Example</h2>

<p id="demo"></p>

<script>
    let name = "JavaScript";

    document.getElementById("demo").innerHTML =
        "String: " + name +
        "<br>Length: " + name.length +
        "<br>Uppercase: " + name.toUpperCase() +
        "<br>Lowercase: " + name.toLowerCase() +
        "<br>Character at 0: " + name.charAt(0);
</script>

</body>
</html>
