<!DOCTYPE html>
<html>
<head>
    <title>String Object</title>
</head>
<body>

    <h2>JavaScript String Object</h2>

    <p id="result"></p>

    <script>
        let str = "Hello JavaScript";

        let output = "Original String: " + str;

        output += "<br>Length: " + str.length;

        output += "<br>Uppercase: " + str.toUpperCase();
        output += "<br>Lowercase: " + str.toLowerCase();
        output += "<br>Character at 0: " + str.charAt(0);
        output += "<br>Index of Java: " + str.indexOf("Java");
        output += "<br>Replace: " + str.replace("JavaScript", "World");
        output += "<br>Substring: " + str.substring(0, 5);
        output += "<br>Includes Java: " + str.includes("Java");

        document.getElementById("result").innerHTML = output;
    </script>

</body>
</html>
