<!DOCTYPE html>
<html>
<head>
    <title>Math Object</title>
</head>
<body>

    <h2>JavaScript Math Object</h2>

    <p id="result"></p>

    <script>
        let num = 25;

        let output = "Number: " + num;

        output += "<br>PI Value: " + Math.PI;

        output += "<br>Square Root: " + Math.sqrt(num);
        output += "<br>Power: " + Math.pow(5, 2);
        output += "<br>Round: " + Math.round(4.6);
        output += "<br>Ceil: " + Math.ceil(4.2);
        output += "<br>Floor: " + Math.floor(4.8);
        output += "<br>Absolute Value: " + Math.abs(-10);
        output += "<br>Random Number: " + Math.random();

        document.getElementById("result").innerHTML = output;
    </script>

</body>
</html>
