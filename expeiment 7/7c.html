<!DOCTYPE html>
<html>
<head>
    <title>Array Object</title>
</head>
<body>

    <h2>JavaScript Array Object</h2>

    <p id="result"></p>

    <script>
        let fruits = ["Apple", "Banana", "Mango"];

        let output = "Original Array: " + fruits +
                     "<br>Array Length: " + fruits.length;

        fruits.push("Orange");
        output += "<br>After push(): " + fruits;

        fruits.pop();
        output += "<br>After pop(): " + fruits;

        fruits.sort();
        output += "<br>After sort(): " + fruits;

        fruits.reverse();
        output += "<br>After reverse(): " + fruits;

        document.getElementById("result").innerHTML = output;
    </script>

</body>
</html>
