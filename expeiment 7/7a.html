<!DOCTYPE html>
<html>
<head>
    <title>Document Object</title>
</head>
<body>

<h2 id="heading">Document Object Example</h2>

<p id="demo"></p>

<script>
    
    document.getElementById("heading").style.color = "green";

    
    document.getElementById("demo").innerHTML =
        "Title: " + document.title;
</script>

</body>
</html>
