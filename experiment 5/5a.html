<DOCTYPE html>
<html>
<head>
    <style>
        h1 {
            color: black;             
        }

        .rgb {
            color: green;   
        }

        .hex {
            color: blue;          
        }

        .rgba {
            color: red; 
        }
    </style>
</head>

<body>

    <h1>Red Color</h1>
    <p class="rgb">Green using RGB</p>
    <p class="hex">Blue using HEX</p>
    <p class="rgba">Red using RGBA</p>

</body>
</html>
