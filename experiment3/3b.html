<!DOCTYPE html>
<html>
<head>
    <title>Audio and Video</title>

    <style>
        body {
            text-align: center;
            background-color: lightblue;
        }

        h2 {
            color: darkblue;
        }

        audio, video {
            margin: 10px;
        }
    </style>
</head>

<body>

    <h1>Multimedia</h1>

    <h2>Audio</h2>
    <audio controls>
        <source src="audio.mp3" type="audio/mpeg">
    </audio>

    <h2>Video</h2>
    <video width="400" controls>
        <source src="video.mp4" type="video/mp4">
    </video>

</body>
</html>
