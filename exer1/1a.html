<!DOCTYPE html>
<html>
<head>
    <title>HTML Lists</title>
</head>
<body>

    <h1>HTML Lists</h1>

    <h2>Unordered List</h2>
    <ul>
        <li>Apple</li>
        <li>Banana</li>
        <li>Mango</li>
        <li>Orange</li>
    </ul>

    <h2>Ordered List</h2>
    <ol>
        <li>Potato</li>
        <li>Tomato</li>
        <li>Carrot</li>
        <li>Onion</li>
    </ol>

    <h2>Description List</h2>
    <dl>
        <dt>Apple</dt>
        <dd>A sweet fruit</dd>

        <dt>Carrot</dt>
        <dd>An orange vegetable</dd>

        <dt>Mango</dt>
        <dd>A tropical fruit</dd>
    </dl>

</body>
</html>
